# idp day-2 template: remove a service that was created from ANY golden-path template.
#
# One removal template for all creation templates. It does not know what python-service (or a
# future Go or Node template) creates. It reads that from the service's own catalog entry,
# where the creating template recorded it as annotations (the contract is in ../README.md):
#
#   idp.surya-idp/template-version  marks a golden-path service; only these can be picked
#   idp.surya-idp/gitops-path       folder in idp-gitops holding its deploy files
#   idp.surya-idp/ecr-repository    its image repository in ECR
#   github.com/project-slug         its source repository
#
# A step runs only when its annotation is present, so a template that creates no image
# repository simply does not write that annotation, and nothing here needs to change.
#
#   0. idp:guard:platform-admin        -> stops anyone who is not a platform admin, before any change
#   1. catalog:fetch                   -> the chosen service's catalog entry
#   2. idp:github:list-files           -> every file under its gitops-path
#   3. publish:github:pull-request     -> PR in idp-gitops deleting those files (the audit record)
#   4. idp:github:await-ci-auto-merge  -> merges it when `validate` is green; Argo CD then removes
#                                         the Application, pods, Service and the ALB route
#   5. idp:aws:ecr:delete-repository   -> its ecr-repository and the images in it
#   6. idp:flags:delete-for-service    -> its feature flags (<service>.*) in the flag API
#   7. idp:aws:s3:delete-docs          -> its documentation site in the docs bucket
#   8. idp:github:archive-repo         -> the source repo becomes read-only (restorable)
#      or idp:github:delete-repo       -> deleted for good, only if the form's box was ticked
#                                         (test services; platform repositories are refused)
#   9. idp:catalog:unregister          -> the service leaves the catalog
#
# Order matters: the deploy config goes first, so nothing is left running that points at images
# or a catalog entry which no longer exist. Every step is safe to run again, so a run that
# failed halfway can simply be started over.
#
# What can be undone: the idp-gitops PR (revert it) and the archive (unarchive in repo
# settings). What cannot: the images in ECR. They can be rebuilt by pushing to the repo.
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: decommission-service
  title: Decommission a service
  description: Removes a golden-path service everywhere - deployment, load balancer route, database, images, feature flags, docs, catalog entry - and archives its repository.
  tags:
    - day-2
    - golden-path
spec:
  owner: DSurya11
  type: service

  parameters:
    - title: Which service
      required: [entity, confirm]
      properties:
        entity:
          title: Service
          type: string
          description: Only services created from a golden-path template are listed.
          ui:field: EntityPicker
          ui:options:
            # Keyed on the platform-wide marker, not on one template's name: every golden-path
            # template writes idp.surya-idp/template-version, so services from a future
            # template (Go, Node ...) appear here with no change. The platform's own
            # components do not have it and cannot be picked.
            catalogFilter:
              kind: Component
              metadata.annotations.idp.surya-idp/template-version:
                exists: true
            defaultKind: Component
        deleteRepository:
          title: Delete the repository instead of archiving it
          type: boolean
          default: false
          description: >-
            For throwaway test services only. Leave this off for a real service: an archived
            repository keeps its code and history and can be restored, a deleted one cannot.
            The one reason to tick it: an archived repository keeps its name taken, so a test
            service could not be created again under the same name.
        confirm:
          title: I understand that this stops the service, deletes its images and archives or deletes its repository
          type: boolean
          # Schema rule, not a hint: the form cannot be submitted until the box is ticked.
          enum: [true]

  steps:
    # First on purpose. The scaffolder checks whether the user may run an action when that
    # step starts, not all steps up front. Without this, someone who is not a platform admin
    # would get as far as merging the removal PR and only then be refused at "Delete the
    # images": a half-removed service. This action is admin-only and changes nothing.
    - id: guard
      name: Check that you may remove services
      action: idp:guard:platform-admin

    - id: entity
      name: Read the catalog entry
      action: catalog:fetch
      input:
        entityRef: ${{ parameters.entity }}

    - id: files
      name: Find the deploy files
      if: ${{ steps.entity.output.entity.metadata.annotations['idp.surya-idp/gitops-path'] }}
      action: idp:github:list-files
      input:
        repoUrl: github.com?owner=surya-idp&repo=idp-gitops
        directory: ${{ steps.entity.output.entity.metadata.annotations['idp.surya-idp/gitops-path'] }}

    - id: pr
      name: Open removal PR in idp-gitops
      if: ${{ steps.entity.output.entity.metadata.annotations['idp.surya-idp/gitops-path'] }}
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=surya-idp&repo=idp-gitops
        branchName: remove-${{ steps.entity.output.entity.metadata.name }}
        title: "Remove ${{ steps.entity.output.entity.metadata.name }} (decommission)"
        description: |
          Removes `${{ steps.entity.output.entity.metadata.name }}` from the dev cluster: deleting `${{ steps.entity.output.entity.metadata.annotations['idp.surya-idp/gitops-path'] }}`
          makes the ApplicationSet delete its Argo CD Application, and with it the pods, the Service
          and the route on the shared ALB.

          Nobody needs to merge this: Backstage merges it when the `validate` check passes. To bring
          the service back, revert this PR.

          Requested by `${{ user.ref }}` through the Backstage decommission-service template.
        filesToDelete: ${{ steps.files.output.files }}

    - id: merge
      name: Merge the removal PR
      if: ${{ steps.entity.output.entity.metadata.annotations['idp.surya-idp/gitops-path'] }}
      action: idp:github:await-ci-auto-merge
      input:
        deployRepoUrl: github.com?owner=surya-idp&repo=idp-gitops
        pullRequestNumber: ${{ steps.pr.output.pullRequestNumber }}
        mergeMethod: SQUASH
        timeoutMinutes: 10

    - id: ecr
      name: Delete the images
      if: ${{ steps.entity.output.entity.metadata.annotations['idp.surya-idp/ecr-repository'] }}
      action: idp:aws:ecr:delete-repository
      input:
        repositoryName: ${{ steps.entity.output.entity.metadata.annotations['idp.surya-idp/ecr-repository'] }}

    # The two below are not recorded in annotations: every golden-path service may have flags
    # (stored as <service>.<flag>) and docs (uploaded by its CI under its name). Both steps
    # are fine with "there are none".
    - id: flags
      name: Delete its feature flags
      action: idp:flags:delete-for-service
      input:
        service: ${{ steps.entity.output.entity.metadata.name }}

    - id: docs
      name: Delete its documentation site
      action: idp:aws:s3:delete-docs
      input:
        name: ${{ steps.entity.output.entity.metadata.name }}

    # Exactly one of the next two runs. Archiving is the default and the right choice for a
    # real service; deleting happens only when the box on the form was ticked.
    - id: archive
      name: Archive the repository
      if: ${{ steps.entity.output.entity.metadata.annotations['github.com/project-slug'] and not parameters.deleteRepository }}
      action: idp:github:archive-repo
      input:
        projectSlug: ${{ steps.entity.output.entity.metadata.annotations['github.com/project-slug'] }}

    - id: delete
      name: Delete the repository (cannot be undone)
      if: ${{ steps.entity.output.entity.metadata.annotations['github.com/project-slug'] and parameters.deleteRepository }}
      action: idp:github:delete-repo
      input:
        projectSlug: ${{ steps.entity.output.entity.metadata.annotations['github.com/project-slug'] }}

    - id: unregister
      name: Remove from the catalog
      action: idp:catalog:unregister
      input:
        entityRef: ${{ parameters.entity }}

  output:
    links:
      - title: Removal PR
        url: ${{ steps.pr.output.remoteUrl }}
      - title: Archived repository
        url: https://github.com/${{ steps.entity.output.entity.metadata.annotations['github.com/project-slug'] }}
