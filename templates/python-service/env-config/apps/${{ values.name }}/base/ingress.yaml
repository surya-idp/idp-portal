# Which path goes to this service. How it is exposed comes from components/public-route.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ values.name }}
spec:
  rules:
    - http:
        paths:
          - path: /${{ values.name }}
            pathType: Prefix
            backend:
              service:
                name: ${{ values.name }}
                port:
                  name: http
