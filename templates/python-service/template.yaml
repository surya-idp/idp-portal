# idp golden path: a new Python service, from form to running behind the ALB.
#
#   1. render skeleton          -> FastAPI app (settings, JSON logs, live/ready probes), tests,
#                                  uv lock file, Dockerfile, docs, a CI file that calls the
#                                  shared workflow in surya-idp/idp-platform
#      catalog:write            -> catalog-info.yaml (records which template made the service)
#   2. publish:github           -> new public repo surya-idp/<name>; its CI builds the image
#   3. render env-config slice  -> apps/<name>: only this service's own values, image pinned to
#                                  the new repo's first commit. The platform's settings come
#                                  from idp-gitops components/. No Argo Application: the
#                                  ApplicationSet in idp-gitops finds apps/<name>/overlays/dev
#   4. publish:github:pull-request -> PR in idp-gitops (the audit record of the deploy)
#   5. catalog:register         -> the service shows up in Backstage immediately
#   6. idp:github:await-ci-auto-merge -> waits for the new repo's CI (the image), then turns on
#                                  GitHub auto-merge; GitHub merges when `validate` is green
#
# No human step: Argo CD deploys within ~3 minutes of the merge. Later pushes to the service
# repo are rolled out by Argo CD Image Updater (idp-gitops/platform/image-updater).
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: python-service
  title: Python service (FastAPI)
  description: New FastAPI service with tests, shared CI to ECR, zero-click deploys, restricted pod security, autoscaling, docs, and a route on the shared ALB.
  tags:
    - python
    - fastapi
    - golden-path
spec:
  owner: DSurya11
  type: service

  parameters:
    - title: Service details
      required: [repoUrl, description, owner]
      properties:
        repoUrl:
          title: Name
          type: string
          description: Lowercase letters, digits and dashes (4-32). Becomes the repo, namespace, ECR repo and URL path.
          # RepoUrlPicker value is github.com?owner=surya-idp&repo=<name>; this pattern validates <name>
          pattern: '^github\.com\?owner=surya-idp&repo=[a-z][a-z0-9-]{2,30}[a-z0-9]$'
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts: [github.com]
            allowedOwners: [surya-idp]
            # The repo is created with the signed-in user's GitHub token: a GitHub App
            # installation token cannot create repos in a user account (POST /user/repos).
            requestUserCredentials:
              secretsKey: USER_OAUTH_TOKEN
        description:
          title: Description
          type: string
          maxLength: 120
        postgres:
          title: Needs a PostgreSQL database
          type: boolean
          default: false
          description: >-
            Gives the service its own database and login on the shared instance, as
            DATABASE_URL and DATABASE_* environment variables. Can also be added later with
            the "Add a PostgreSQL database" template.
        owner:
          title: Owner
          type: string
          description: The user or group responsible for the service.
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: [Group, User]

  steps:
    - id: skeleton
      name: Render service code
      action: fetch:template
      input:
        url: ./skeleton
        copyWithoutTemplating:
          - .github/workflows/*
        values:
          name: ${{ parameters.repoUrl | parseRepoUrl | pick('repo') }}
          # The description is free text typed by a person. It goes only into prose and into
          # quoted strings (pyproject.toml, mkdocs.yml: `| dump`), never into code that a
          # linter or formatter checks: a trailing space once failed the first CI run.
          description: ${{ parameters.description | trim }}

    # Written by the scaffolder instead of copied from the skeleton: catalog:write adds the
    # backstage.io/source-template annotation, so every service made from this template can
    # be listed later (for example to roll out a change to all of them).
    - id: catalog
      name: Write catalog entry
      action: catalog:write
      input:
        entity:
          apiVersion: backstage.io/v1alpha1
          kind: Component
          metadata:
            name: ${{ parameters.repoUrl | parseRepoUrl | pick('repo') }}
            description: ${{ parameters.description | trim }}
            annotations:
              github.com/project-slug: surya-idp/${{ parameters.repoUrl | parseRepoUrl | pick('repo') }}
              backstage.io/kubernetes-id: ${{ parameters.repoUrl | parseRepoUrl | pick('repo') }}
              backstage.io/techdocs-ref: dir:.
              # What this template created outside the repo. Day-2 templates read these
              # instead of guessing from the name: decommission-service removes exactly what
              # is listed here, so it works for any template (templates/README.md).
              idp.surya-idp/gitops-path: apps/${{ parameters.repoUrl | parseRepoUrl | pick('repo') }}
              idp.surya-idp/ecr-repository: svc/${{ parameters.repoUrl | parseRepoUrl | pick('repo') }}
              # The platform-wide marker of a golden-path service: day-2 templates such as
              # decommission-service list services by it. Every golden-path template must
              # write it. Bump when the skeleton changes in a way existing services should adopt.
              idp.surya-idp/template-version: "2"
            tags:
              - python
              - fastapi
              - golden-path
          spec:
            type: service
            lifecycle: experimental
            owner: ${{ parameters.owner }}

    - id: publish
      name: Create GitHub repository
      action: publish:github
      input:
        repoUrl: ${{ parameters.repoUrl }}
        token: ${{ secrets.USER_OAUTH_TOKEN }}
        description: ${{ parameters.description | trim }}
        repoVisibility: public
        defaultBranch: main
        protectDefaultBranch: false

    - id: envconfig
      name: Render deployment config
      action: fetch:template
      input:
        url: ./env-config
        targetPath: ./env-config-change
        values:
          name: ${{ parameters.repoUrl | parseRepoUrl | pick('repo') }}
          commitHash: ${{ steps.publish.output.commitHash }}
          postgres: ${{ parameters.postgres }}

    - id: pr
      name: Open deploy PR in env-config
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=surya-idp&repo=idp-gitops
        branchName: add-${{ parameters.repoUrl | parseRepoUrl | pick('repo') }}
        title: "Deploy ${{ parameters.repoUrl | parseRepoUrl | pick('repo') }} (golden path)"
        description: |
          Adds `${{ parameters.repoUrl | parseRepoUrl | pick('repo') }}` to the dev cluster: ServiceAccount, Deployment,
          Service, Ingress (shared ALB, path `/${{ parameters.repoUrl | parseRepoUrl | pick('repo') }}`), HPA and PDB.
          Only the service's own values are in this PR; the platform's settings come from `components/`.

          Image: `svc/${{ parameters.repoUrl | parseRepoUrl | pick('repo') }}:${{ steps.publish.output.commitHash }}`, built by
          ${{ steps.publish.output.remoteUrl }}/actions.

          Nobody needs to merge this: once that CI run is green, Backstage enables auto-merge
          and GitHub merges when the `validate` check passes.

          Created by the Backstage python-service template.
        sourcePath: ./env-config-change
        targetPath: .

    - id: register
      name: Register in the catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

    # Last, so a slow or red CI run still leaves a registered service and an open PR.
    - id: automerge
      name: Wait for CI, then merge the deploy PR
      action: idp:github:await-ci-auto-merge
      input:
        serviceRepoUrl: ${{ parameters.repoUrl }}
        commitSha: ${{ steps.publish.output.commitHash }}
        deployRepoUrl: github.com?owner=surya-idp&repo=idp-gitops
        pullRequestNumber: ${{ steps.pr.output.pullRequestNumber }}
        token: ${{ secrets.USER_OAUTH_TOKEN }}
        mergeMethod: SQUASH
        timeoutMinutes: 15

  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: CI runs
        url: ${{ steps.publish.output.remoteUrl }}/actions
      - title: Deploy PR (merged automatically)
        url: ${{ steps.pr.output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
