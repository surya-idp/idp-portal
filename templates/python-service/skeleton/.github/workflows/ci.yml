# The pipeline itself lives in surya-idp/idp-platform (one place for every service):
# lint, format check, type check, tests + coverage gate, arm64 image, Trivy, push to ECR on main.
# It is pinned to a commit; Dependabot opens the PR when a new version is released.
#
# Copied WITHOUT templating: GitHub's ${{ }} syntax would clash with the scaffolder's.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.sha }}
  cancel-in-progress: true

permissions: {}

jobs:
  ci:
    uses: surya-idp/idp-platform/.github/workflows/python-service.yml@8f097a3c1aba497df996903f7819edfc14de0393 # v1.0.0
    permissions:
      contents: read
      id-token: write   # OIDC to AWS for the ECR push, no stored credentials
