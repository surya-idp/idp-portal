# The pipeline itself lives in surya-idp/idp-platform (one place for every service):
# lint, format check, type check, tests + coverage gate, arm64 image, Trivy, push to ECR on main,
# then signed build provenance and a signed SBOM for the pushed image.
# It is pinned to a commit; Dependabot opens the PR when a new version is released.
#
# Copied WITHOUT templating: GitHub's ${{ }} syntax would clash with the scaffolder's.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.sha }}
  cancel-in-progress: true

permissions: {}

jobs:
  ci:
    uses: surya-idp/idp-platform/.github/workflows/python-service.yml@3d15dbfbf73ecf7df2ab8e72238bc4c4f1e6bf3c # v2.1.1
    permissions:
      contents: read
      id-token: write       # OIDC to AWS for the ECR push and to Sigstore for signing: no stored keys
      attestations: write   # signed build provenance + SBOM for every pushed image
