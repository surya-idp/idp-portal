# Weekly dependency PRs; CI tests each one (golden path default).
version: 2
updates:
  # Also bumps the pinned commit of the shared CI workflow (surya-idp/idp-platform).
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups: {actions: {patterns: ["*"]}}
  - package-ecosystem: uv
    directory: /
    schedule: {interval: weekly}
    groups: {python: {patterns: ["*"]}}
  - package-ecosystem: docker
    directory: /
    schedule: {interval: weekly}
