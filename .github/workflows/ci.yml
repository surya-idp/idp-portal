# idp-portal (Backstage) CI
#
#   build            every push/PR: install, typecheck, unit tests, build the backend bundle
#   template         every push/PR: render the python-service template with the real scaffolder
#                    (dry run) and prove the result works (scripts/test-template.sh)
#   (in build)       main only: build the arm64 image, Trivy scan, then push to ECR (OIDC, no
#                    static keys)
#
# Deploying is not this workflow's job any more: Argo CD Image Updater in the cluster sees the
# new tag in ECR and commits it to idp-gitops (idp-gitops/platform/image-updater). Whatever is
# in ECR gets deployed, so the scan runs BEFORE the push. This repo holds no deploy credential.
#
# Runs on GitHub's native ARM64 runners (free for public repos): the EKS nodes are
# Graviton (t4g), so no QEMU emulation - a Backstage build under QEMU takes 30-60 min.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# One run per commit. GitHub started two runs for the same push (2026-09-26); both built
# and the second failed pushing the same IMMUTABLE tag. Keyed on the SHA, so a new commit
# never cancels the build of a different one.
concurrency:
  group: ci-${{ github.sha }}
  cancel-in-progress: true

env:
  ECR_IMAGE: 693906847772.dkr.ecr.ap-south-1.amazonaws.com/idp-portal

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    # One build per branch at a time, in push order. Image Updater deploys the image that was
    # BUILT last, so two merges seconds apart must not build in parallel: the older commit
    # could finish second and be deployed (both ran side by side on 2026-10-11). If a third
    # push arrives while one waits, GitHub drops the waiting one; the newest still wins.
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write          # OIDC to AWS (image step, main only)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Enable Corepack (Yarn 4 from packageManager)
        run: corepack enable

      - name: Install
        run: yarn install --immutable

      - name: Typecheck
        run: yarn tsc

      - name: Unit tests (custom scaffolder actions)
        run: yarn workspace backend test
        env:
          CI: "true"

      - name: Build backend bundle
        run: yarn build:backend

      # Built into the runner's Docker (native arm64); nothing is pushed yet.
      - name: Build image (native arm64)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker build -f packages/backend/Dockerfile \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            -t "${ECR_IMAGE}:${GITHUB_SHA}" .

      # HIGH/CRITICAL with a fix available fails the job here, before the push. An image that
      # fails never reaches ECR, so Image Updater can never deploy it.
      - name: Trivy vulnerability scan
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.ECR_IMAGE }}:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Configure AWS credentials via OIDC
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::693906847772:role/idp-github-ci
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      # "Re-run" of a green build: the SHA tag is immutable and already in ECR.
      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if aws ecr describe-images --repository-name idp-portal \
               --image-ids imageTag="${GITHUB_SHA}" >/dev/null 2>&1; then
            echo "Image ${GITHUB_SHA} already in ECR - skipping push"
          else
            docker push "${ECR_IMAGE}:${GITHUB_SHA}"
          fi

  # A template change that would give developers a broken service fails here, before merge.
  # x64 runner: it has kubectl preinstalled, and this job only tests (no image is pushed).
  template:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
      KYVERNO_VERSION: v1.19.1
      KYVERNO_SHA256: b38228f367fc0fdc2b08f4c83ea50ac5f16c60ff8d62d76a66157c33c47b70ae
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Enable Corepack (Yarn 4 from packageManager)
        run: corepack enable

      - name: Install
        run: yarn install --immutable

      # Same uv version as the shared CI workflow (surya-idp/idp-platform).
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          enable-cache: false

      - name: Install kubeconform (pinned + checksum) and PyYAML
        run: |
          curl -sSfL -o kc.tgz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kc.tgz" | sha256sum -c -
          tar xzf kc.tgz kubeconform && sudo mv kubeconform /usr/local/bin/ && rm kc.tgz
          python3 -c 'import yaml' || pip install --user pyyaml==6.0.2

      # idp-gitops' validate.sh also runs the platform's admission policies against the
      # rendered service: a template that produces a service the cluster would reject fails here.
      - name: Install the Kyverno CLI (pinned + checksum)
        run: |
          curl -sSfL -o kyverno.tgz "https://github.com/kyverno/kyverno/releases/download/${KYVERNO_VERSION}/kyverno-cli_${KYVERNO_VERSION}_linux_x86_64.tar.gz"
          echo "${KYVERNO_SHA256}  kyverno.tgz" | sha256sum -c -
          tar xzf kyverno.tgz kyverno && sudo mv kyverno /usr/local/bin/ && rm kyverno.tgz

      - name: Render the template and test the result
        run: ./scripts/test-template.sh
