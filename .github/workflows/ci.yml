# idp-portal (Backstage) CI
#
#   build            every push/PR: install, typecheck, build the backend bundle
#   image            main only: build the arm64 image, push to ECR (OIDC, no static keys), Trivy
#   update-env-config main only: bump the tag in env-config (apps/idp-portal/overlays/dev)
#
# Runs on GitHub's native ARM64 runners (free for public repos): the EKS nodes are
# Graviton (t4g), so no QEMU emulation - a Backstage build under QEMU takes 30-60 min.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# One run per commit. GitHub started two runs for the same push (2026-09-26); both built
# and the second failed pushing the same IMMUTABLE tag. Keyed on the SHA, so a new commit
# never cancels the build of a different one.
concurrency:
  group: ci-${{ github.sha }}
  cancel-in-progress: true

env:
  ECR_IMAGE: 693906847772.dkr.ecr.ap-south-1.amazonaws.com/idp-portal

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write          # OIDC to AWS (image step, main only)
    outputs:
      image_tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Enable Corepack (Yarn 4 from packageManager)
        run: corepack enable

      - name: Install
        run: yarn install --immutable

      - name: Typecheck
        run: yarn tsc

      - name: Build backend bundle
        run: yarn build:backend

      - name: Configure AWS credentials via OIDC
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::693906847772:role/idp-github-ci
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Build and push image (native arm64)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker build -f packages/backend/Dockerfile \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            -t "${ECR_IMAGE}:${GITHUB_SHA}" .
          # "Re-run" of a green build: the SHA tag is immutable and already in ECR.
          # Skip the push instead of failing; Trivy below still scans the local build.
          if aws ecr describe-images --repository-name idp-portal \
               --image-ids imageTag="${GITHUB_SHA}" >/dev/null 2>&1; then
            echo "Image ${GITHUB_SHA} already in ECR - skipping push"
          else
            docker push "${ECR_IMAGE}:${GITHUB_SHA}"
          fi

      # Same gate as feature-flag-service: HIGH/CRITICAL with a fix available fails the
      # job, so update-env-config never ships the image. The image is local here (native
      # build, no buildx push), so Trivy scans it straight from the docker daemon.
      - name: Trivy vulnerability scan
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.ECR_IMAGE }}:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

  update-env-config:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Generate GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.FF_IDP_CI_BOT_APP_ID }}
          private-key: ${{ secrets.FF_IDP_CI_BOT_PRIVATE_KEY }}
          owner: surya-idp
          repositories: idp-gitops

      - name: Bump idp-portal tag in env-config
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
          NEW_TAG: ${{ needs.build.outputs.image_tag }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          git clone "https://x-access-token:${TOKEN}@github.com/surya-idp/idp-gitops.git" env-config
          cd env-config
          F=apps/idp-portal/overlays/dev/kustomization.yaml
          sed -i "s|newTag:.*|newTag: ${NEW_TAG}|" "$F"
          # Commit as the App's bot user (name from the token, so an App rename needs no edit here)
          BOT_ID=$(GH_TOKEN="${TOKEN}" gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${BOT_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add "$F"
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore(deploy): update idp-portal image to ${NEW_TAG}"
          # Other CI bots push to the same repo; rebase onto theirs (different files) and retry.
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && break
            [ "$i" = 3 ] && exit 1
            sleep $((i * 5))
          done
