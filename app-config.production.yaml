app:
  # Should be the same as backend.baseUrl when using the `app-backend` plugin.
  baseUrl: http://localhost:7007

backend:
  # Note that the baseUrl should be the URL that the browser and other clients
  # should use when communicating with the backend, i.e. it needs to be
  # reachable not just from within the backend host, but from all of your
  # callers. When its value is "http://localhost:7007", it's strictly private
  # and can't be reached by others.
  baseUrl: http://localhost:7007
  # The listener can also be expressed as a single <host>:<port> string. In this case we bind to
  # all interfaces, the most permissive setting. The right value depends on your specific deployment.
  listen: ':7007'

  # config options: https://node-postgres.com/apis/client
  database:
    client: pg
    # One database, one schema per plugin. The default (one DATABASE per plugin) needs the
    # CREATEDB right, which only the RDS master user had. Backstage now has a login of its own
    # that owns exactly the database `backstage` (idp-gitops apps/idp-portal/base/database.yaml,
    # PLATFORM_REVIEW F3), so it creates schemas there and never databases.
    pluginDivisionMode: schema
    ensureExists: false
    ensureSchemaExists: true
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
      database: ${POSTGRES_DB}
      # RDS PostgreSQL 16 enforces SSL (rds.force_ssl=1). Node's pg driver does not
      # negotiate it by default, so connect with TLS verified against AWS's public RDS CA.
      ssl:
        ca:
          $file: ./rds-ca-global-bundle.pem
      # https://node-postgres.com/features/ssl
      # you can set the sslmode configuration option via the `PGSSLMODE` environment variable
      # see https://www.postgresql.org/docs/current/libpq-ssl.html Table 33.1. SSL Mode Descriptions (e.g. require)
      # ssl:
      #   ca: # if you have a CA file and want to verify it you can uncomment this section
      #     $file: <file-path>/ca/server.crt

# GitHub App "idp-backstage" (Step 30): catalog reads + scaffolder writes (create repos,
# open PRs). Values come from idp/backstage-github-app via ESO; they are loaded into
# Secrets Manager from ~/.idp on the operator's laptop by `make up` (never in Git).
# This list REPLACES app-config.yaml's PAT-based entry (config arrays are not merged).
integrations:
  github:
    - host: github.com
      apps:
        - appId: ${GITHUB_APP_ID}
          clientId: ${GITHUB_APP_CLIENT_ID}
          clientSecret: ${GITHUB_APP_CLIENT_SECRET}
          privateKey: ${GITHUB_APP_PRIVATE_KEY}

auth:
  environment: production
  providers:
    # GitHub sign-in via the GitHub App's OAuth client. The App's callback URL must be
    # http://localhost:7007/api/auth/github/handler/frame (Backstage is reached only via
    # port-forward). Templates use the signed-in user's token to create repos: an App
    # installation token cannot create repos in a user account (POST /user/repos).
    github:
      production:
        clientId: ${GITHUB_APP_CLIENT_ID}
        clientSecret: ${GITHUB_APP_CLIENT_SECRET}
        signIn:
          resolvers:
            # GitHub login must equal a User entity name (examples/org.yaml)
            - resolver: usernameMatchingUserEntityName
    # No guest sign-in here: what a person may do depends on who they are
    # (packages/backend/src/permissions). app-config.yaml's `guest: {}` is harmless in a
    # production build (the provider refuses outside development) and the sign-in page
    # does not offer it.

# Enforced by our policy: destructive scaffolder actions and removing catalog entries are
# for group platform-admins (examples/org.yaml).
permission:
  enabled: true

catalog:
  # Overrides the default list locations from app-config.yaml as these contain example data.
  # See https://backstage.io/docs/features/software-catalog/#adding-components-to-the-catalog for more details
  # on how to get entities into the catalog.
  # Every repository of the org that has a catalog-info.yaml on main is in the catalog, found
  # by a scan every 5 minutes. No list to maintain: a new service appears by itself (the
  # create template also registers it at once, so nobody waits for the scan), and an archived
  # repository drops out by itself (allowArchived defaults to false), which is what
  # "Decommission a service" does to a repo.
  providers:
    github:
      surya-idp:
        organization: surya-idp
        catalogPath: /catalog-info.yaml
        filters:
          branch: main
        schedule:
          frequency: { minutes: 5 }
          timeout: { minutes: 3 }

  locations:
    # Every golden path template, listed in one Location read from GitHub: adding or
    # changing a template is a git push, no image rebuild. (Template is allowed by the
    # global catalog.rules in app-config.yaml; nested targets do not inherit per-location rules.)
    - type: url
      target: https://github.com/surya-idp/idp-portal/blob/main/templates/all-templates.yaml

    # Users and groups: who can sign in, and who is a platform admin (path relative to the
    # container's working directory)
    - type: file
      target: ./examples/org.yaml
      rules:
        - allow: [User, Group]
