---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-user
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: guest
spec:
  memberOf: [guests]
---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-group
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: guests
spec:
  type: team
  children: []
---
# GitHub sign-in resolves to this user (usernameMatchingUserEntityName: GitHub login == name)
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: DSurya11
spec:
  profile:
    displayName: DSurya11
  memberOf: [platform-admins]
---
# Members may run destructive templates (decommission) and remove any catalog entry
# (packages/backend/src/permissions/policy.ts). Everyone else who signs in can read
# everything and create services, databases and flags.
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: platform-admins
  description: Owns the platform; allowed to remove services
spec:
  type: team
  children: []
